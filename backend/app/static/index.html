<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formularze AI — konwersja formularza do JSON</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --text: #1b1f24; --muted: #5a6470; --border: #d6dbe1;
    --primary: #0052a5; --primary-hover: #003f80; --error: #b3261e; --error-bg: #fdecea;
    --ok: #1e6b35; --ok-bg: #e7f4ea; --warn: #7a4b00; --warn-bg: #fff4e0; --info-bg: #eef4fb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1000px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 1.15rem; margin: 0; flex: 1; }
  .bar small { color: var(--muted); font-weight: normal; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 20px 48px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 20px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p.hint { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  label.top { display: block; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=email], select, textarea {
    width: 100%; max-width: 480px; padding: 9px 11px; font: inherit; border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  textarea { min-height: 90px; resize: vertical; }
  input[readonly] { background: var(--bg); color: var(--muted); }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .drop:focus-visible {
    outline: 3px solid #7fb1e6; outline-offset: 2px;
  }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--primary);
           background: var(--primary); color: #fff; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--primary-hover); }
  button.secondary { background: var(--surface); color: var(--primary); }
  button.secondary:hover:not(:disabled) { background: var(--info-bg); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 26px 16px; text-align: center; cursor: pointer; background: #fafbfc; }
  .drop.over { border-color: var(--primary); background: var(--info-bg); }
  .drop strong { color: var(--primary); }
  .file-name { margin-top: 10px; font-weight: 600; word-break: break-all; }
  .msg { border-radius: 6px; padding: 10px 14px; margin-top: 16px; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .msg.info { background: var(--info-bg); color: var(--primary); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  dl.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 0; }
  dl.stats div { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  dt { color: var(--muted); font-size: .85rem; }
  dd { margin: 0; font-weight: 600; word-break: break-word; }
  ul.list { margin: 8px 0 0; padding-left: 20px; }
  pre { background: #0f1720; color: #e6edf3; border-radius: 8px; padding: 16px; overflow: auto; max-height: 560px;
        font-size: .85rem; line-height: 1.45; margin: 16px 0 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: .92rem; }
  th, td { text-align: left; border-bottom: 1px solid var(--border); padding: 6px 8px; vertical-align: top; }
  .table-wrap { overflow-x: auto; }
  [hidden] { display: none !important; }
  .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent;
             border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  /* Zakładki wyniku */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 16px 0 0; flex-wrap: wrap; }
  .tabs button { background: none; color: var(--muted); border: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 8px 14px; }
  .tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
  .tabs button:hover:not(:disabled) { background: var(--info-bg); }
  .panel { padding-top: 16px; }

  /* Podgląd eUsługi */
  .preview { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
  @media (max-width: 760px) { .preview { grid-template-columns: 1fr; } }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps button { width: 100%; text-align: left; background: none; border: none; color: var(--text); font-weight: normal;
                  padding: 8px 10px; border-radius: 6px; display: flex; gap: 8px; }
  .steps button:hover { background: var(--info-bg); }
  .steps button[aria-current="step"] { background: var(--info-bg); color: var(--primary); font-weight: 700; }
  .steps .num { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; border: 1px solid currentColor;
                align-items: center; justify-content: center; font-size: .8rem; flex: none; }
  .progress { height: 6px; background: var(--bg); border-radius: 3px; margin: 4px 0 16px; overflow: hidden; }
  .progress div { height: 100%; background: var(--primary); }
  .eform h3 { margin: 0 0 4px; font-size: 1.2rem; }
  .eform .step-label { color: var(--muted); font-size: .9rem; }
  fieldset.section { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px 16px; margin: 16px 0 0; }
  fieldset.section legend { font-weight: 700; padding: 0 6px; }
  .desc { color: var(--muted); font-size: .92rem; }
  .desc p { margin: 4px 0; }
  .field { margin-top: 14px; }
  .field > .label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field .req { color: var(--error); }
  .field .tech { color: var(--muted); font-weight: normal; font-size: .78rem; font-family: ui-monospace, monospace; margin-left: 6px; }
  .field .badge { font-size: .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0 7px;
                  margin-left: 6px; font-weight: normal; color: var(--muted); }
  .choice { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; font-weight: normal; }
  .choice input { margin-top: 4px; }
  .field-error { color: var(--error); font-size: .9rem; margin-top: 4px; }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--error); }
  .text-block { background: var(--info-bg); border-radius: 6px; padding: 10px 12px; margin-top: 14px; }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .toggle { font-weight: normal; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Formularze AI <small>— konwersja formularza do konfiguracji eUsługi</small></h1>
    <button id="logout" class="secondary" hidden>Wyloguj</button>
  </div>
</header>

<main>
  <!-- Logowanie -->
  <section id="login-card" class="card" hidden>
    <h2>Zaloguj się</h2>
    <form id="login-form" novalidate>
      <label class="top" for="username">Login</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label class="top" for="password">Hasło</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="row"><button type="submit" id="login-btn">Zaloguj</button></div>
      <div id="login-msg" class="msg error" role="alert" hidden></div>
    </form>
  </section>

  <!-- Wgrywanie pliku -->
  <section id="upload-card" class="card" hidden>
    <h2>Wgraj formularz</h2>
    <p class="hint">Obsługiwane formaty: PDF, DOC, DOCX, ODS, XLSX, JPG, JPEG, PNG. Analiza trwa zwykle od kilkudziesięciu
      sekund do kilku minut.</p>
    <div id="drop" class="drop" tabindex="0" role="button" aria-describedby="drop-help">
      <div><strong>Wybierz plik</strong> albo przeciągnij go tutaj</div>
      <div id="drop-help" class="hint" style="margin:6px 0 0">Jeden plik na raz</div>
      <div id="file-name" class="file-name" hidden></div>
    </div>
    <input id="file" type="file" accept=".pdf,.doc,.docx,.ods,.xlsx,.jpg,.jpeg,.png" hidden>
    <div class="row">
      <button id="convert" disabled>Konwertuj do JSON</button>
      <button id="open-json" class="secondary" title="Podgląd gotowego pliku JSON bez konwersji">Otwórz plik JSON</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <input id="json-file" type="file" accept=".json,application/json" hidden>
    <div id="upload-msg" class="msg error" role="alert" hidden></div>
  </section>

  <!-- Wynik -->
  <section id="result-card" class="card" hidden>
    <h2 id="result-title">Wynik</h2>
    <div class="row" style="margin-top:4px">
      <button id="download">Pobierz JSON</button>
      <button id="download-dicts" class="secondary" hidden>Pobierz słowniki</button>
      <button id="copy" class="secondary">Kopiuj JSON</button>
      <span id="copy-status" role="status" aria-live="polite"></span>
    </div>
    <div class="tabs" role="tablist" aria-label="Widok wyniku">
      <button role="tab" id="tab-preview" aria-controls="panel-preview" aria-selected="true">Podgląd formularza</button>
      <button role="tab" id="tab-json" aria-controls="panel-json" aria-selected="false" tabindex="-1">JSON</button>
      <button role="tab" id="tab-report" aria-controls="panel-report" aria-selected="false" tabindex="-1">Raport</button>
    </div>
    <div id="panel-preview" class="panel" role="tabpanel" aria-labelledby="tab-preview">
      <div class="preview">
        <nav aria-label="Strony formularza">
          <ol id="steps" class="steps"></ol>
          <label class="toggle" style="margin-top:12px"><input type="checkbox" id="show-tech"> Pokaż nazwy techniczne</label>
        </nav>
        <form id="eform" class="eform" novalidate></form>
      </div>
    </div>
    <div id="panel-json" class="panel" role="tabpanel" aria-labelledby="tab-json" hidden>
      <pre id="json" tabindex="0" aria-label="Wygenerowany JSON"></pre>
    </div>
    <div id="panel-report" class="panel" role="tabpanel" aria-labelledby="tab-report" hidden>
      <dl id="stats" class="stats"></dl>
      <div id="notes"></div>
      <div id="dicts"></div>
    </div>
  </section>
</main>

<script src="/static/vendor/jsonata.min.js"></script>
<script>
"use strict";
const ALLOWED = [".pdf", ".doc", ".docx", ".ods", ".xlsx", ".jpg", ".jpeg", ".png"];
const FORBIDDEN_CHARS = /[;:><\/\\|'*%$]/;
const TOKEN_KEY = "formularze-token";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter((c) => c !== null && c !== undefined));
  return node;
};

let authRequired = true;
let selectedFile = null;
let current = null; // { form, report, baseName }

const storage = {
  get() { try { return sessionStorage.getItem(TOKEN_KEY); } catch { return null; } },
  set(v) { try { sessionStorage.setItem(TOKEN_KEY, v); } catch { /* brak dostępu do storage */ } },
  clear() { try { sessionStorage.removeItem(TOKEN_KEY); } catch { /* j.w. */ } },
};

function show(node, text, kind) {
  node.textContent = text;
  if (kind) node.className = "msg " + kind;
  node.hidden = !text;
}

async function problemDetail(response) {
  try {
    const body = await response.json();
    if (typeof body.detail === "string") return body.detail;
    if (Array.isArray(body.detail)) return body.detail.map((d) => d.msg).join("; ");
  } catch { /* odpowiedź nie jest JSON-em */ }
  return `Błąd HTTP ${response.status}`;
}

/* ============================================================ logowanie */

function showScreen(loggedIn) {
  $("login-card").hidden = loggedIn;
  $("upload-card").hidden = !loggedIn;
  $("logout").hidden = !(loggedIn && authRequired);
  if (!loggedIn) { $("result-card").hidden = true; $("username").focus(); }
}

async function init() {
  try {
    const cfg = await (await fetch("/api/v1/auth/config")).json();
    authRequired = cfg.authEnabled;
    if (authRequired && !cfg.loginConfigured) {
      show($("login-msg"), "Logowanie nie jest skonfigurowane na serwerze (AUTH_USERNAME, AUTH_PASSWORD).", "error");
    }
  } catch {
    show($("login-msg"), "Nie można połączyć się z serwerem.", "error");
  }
  showScreen(!authRequired || Boolean(storage.get()));
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) { show($("login-msg"), "Podaj login i hasło.", "error"); return; }
  $("login-btn").disabled = true;
  try {
    const res = await fetch("/api/v1/auth/token", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }),
    });
    if (!res.ok) { show($("login-msg"), await problemDetail(res), "error"); return; }
    storage.set((await res.json()).access_token);
    $("password").value = "";
    show($("login-msg"), "");
    showScreen(true);
  } catch {
    show($("login-msg"), "Nie można połączyć się z serwerem.", "error");
  } finally {
    $("login-btn").disabled = false;
  }
});

$("logout").addEventListener("click", () => { storage.clear(); showScreen(false); });

/* ============================================================ wgrywanie i konwersja */

// Walidacja w przeglądarce odpowiada regułom serwera; serwer i tak sprawdza wszystko ponownie (MIME z zawartości).
function validateFile(file) {
  const name = file.name;
  const ext = name.includes(".") ? name.slice(name.lastIndexOf(".")).toLowerCase() : "";
  if (!ALLOWED.includes(ext)) return `Nieobsługiwany format „${ext || "brak rozszerzenia"}”. Dozwolone: ${ALLOWED.join(", ")}.`;
  if (name.length > 250) return "Nazwa pliku nie może przekraczać 250 znaków.";
  if (FORBIDDEN_CHARS.test(name)) return "Nazwa pliku zawiera niedozwolone znaki: ; : > < / \\ | ' * % $";
  if (file.size === 0) return "Plik jest pusty.";
  return null;
}

function selectFile(file) {
  const error = file ? validateFile(file) : null;
  show($("upload-msg"), error || "", "error");
  selectedFile = file && !error ? file : null;
  $("file-name").textContent = selectedFile ? `${selectedFile.name} (${(selectedFile.size / 1024).toFixed(0)} KB)` : "";
  $("file-name").hidden = !selectedFile;
  $("convert").disabled = !selectedFile;
}

const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files.length > 1) { show($("upload-msg"), "Wgraj jeden plik na raz.", "error"); return; }
  selectFile(e.dataTransfer.files[0] || null);
});
$("file").addEventListener("change", (e) => selectFile(e.target.files[0] || null));

$("convert").addEventListener("click", async () => {
  if (!selectedFile) return;
  const status = $("status");
  const started = Date.now();
  const tick = () => { status.innerHTML = `<span class="spinner"></span>Analiza… ${Math.round((Date.now() - started) / 1000)} s`; };
  tick();
  const timer = setInterval(tick, 1000);
  $("convert").disabled = true;
  show($("upload-msg"), "");
  const body = new FormData();
  body.append("file", selectedFile);
  const headers = {};
  const token = storage.get();
  if (authRequired && token) headers.Authorization = `Bearer ${token}`;
  try {
    const res = await fetch("/api/v1/forms/convert?report=true", { method: "POST", headers, body });
    if (res.status === 401 && authRequired) {
      storage.clear(); showScreen(false);
      show($("login-msg"), "Sesja wygasła — zaloguj się ponownie.", "error");
      return;
    }
    if (!res.ok) { show($("upload-msg"), await problemDetail(res), "error"); return; }
    const data = await res.json();
    await renderResult(data.form, data.report, selectedFile.name);
  } catch (err) {
    console.error(err);
    show($("upload-msg"), "Nie można połączyć się z serwerem.", "error");
  } finally {
    clearInterval(timer);
    status.textContent = "";
    $("convert").disabled = !selectedFile;
  }
});

// Podgląd gotowego pliku JSON — bez konwersji i bez wywołań modelu.
$("open-json").addEventListener("click", () => $("json-file").click());
$("json-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const parsed = JSON.parse((await file.text()).replace(/^﻿/, ""));
    const form = parsed.form && parsed.form.tabs ? parsed.form : parsed; // także odpowiedź z ?report=true
    if (!Array.isArray(form.tabs)) throw new Error("Brak tablicy „tabs”.");
    show($("upload-msg"), "");
    await renderResult(form, parsed.report || null, file.name);
  } catch (err) {
    show($("upload-msg"), `To nie jest poprawna konfiguracja formularza: ${err.message}`, "error");
  }
});

/* ============================================================ wynik: zakładki, JSON, raport */

const TABS = ["preview", "json", "report"];
function selectTab(name) {
  for (const t of TABS) {
    const on = t === name;
    $("tab-" + t).setAttribute("aria-selected", String(on));
    $("tab-" + t).tabIndex = on ? 0 : -1;
    $("panel-" + t).hidden = !on;
  }
}
for (const t of TABS) $("tab-" + t).addEventListener("click", () => selectTab(t));
$("tab-preview").parentElement.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const visible = TABS.filter((t) => !$("tab-" + t).hidden);
  const idx = visible.findIndex((t) => $("tab-" + t).getAttribute("aria-selected") === "true");
  const next = visible[(idx + (e.key === "ArrowRight" ? 1 : visible.length - 1)) % visible.length];
  selectTab(next); $("tab-" + next).focus();
});

function stat(label, value) {
  return el("div", {}, el("dt", { textContent: label }), el("dd", { textContent: String(value) }));
}

function note(kind, title, items) {
  const box = el("div", { className: "msg " + kind }, el("strong", { textContent: title }));
  if (items.length) box.append(el("ul", { className: "list" }, ...items.map((i) => el("li", { textContent: i }))));
  return box;
}

function renderReport(report) {
  const a = report.analysis, s = report.stats, usage = a.llmUsage;
  const stats = $("stats");
  stats.replaceChildren(
    stat("Analiza", a.analyzer === "llm" ? `model językowy (${a.model})` : "reguły"),
    stat("Urząd", a.authority || "—"),
    stat("Strony", s.pages), stat("Sekcje", s.sections), stat("Pola", s.fields),
    stat("Pola warunkowe", s.conditional),
    stat("Czas", `${(report.durationMs / 1000).toFixed(1)} s`),
  );
  if (report.extraction.ocr) stats.append(stat("OCR", report.extraction.ocrEngine || "tak"));
  if (usage && usage.calls) stats.append(stat("Tokeny modelu", `${usage.prompt_tokens} + ${usage.completion_tokens}`));

  const notes = $("notes");
  notes.replaceChildren();
  if (report.issues.length) notes.append(note("error", "Problemy w konfiguracji:", report.issues));
  if (report.warnings.length) notes.append(note("warn", "Ostrzeżenia:", report.warnings));
  if (!report.issues.length && !report.warnings.length) notes.append(note("ok", "Konfiguracja przeszła kontrolę reguł bez uwag.", []));

  const dicts = $("dicts");
  dicts.replaceChildren();
  if (report.proposedDictionaries.length) {
    const rows = report.proposedDictionaries.map((d) => el("tr", {},
      el("td", {}, el("strong", { textContent: d.name }), el("div", { className: "desc", textContent: d.description })),
      el("td", { textContent: d.values.join(", ") }),
      el("td", { textContent: (d.used_by || []).join(", ") || "—" })));
    dicts.append(el("h2", { textContent: "Propozycje nowych słowników", style: "margin-top:20px" }),
      el("div", { className: "table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", { textContent: "Słownik" }), el("th", { textContent: "Wartości" }),
          el("th", { textContent: "Używany w polach" }))),
        el("tbody", {}, ...rows))));
  }
}

async function renderResult(form, report, sourceName) {
  current = { form, report, baseName: sourceName.replace(/\.[^.]+$/, "") };
  $("result-title").textContent = form.title || "Wynik";
  $("json").textContent = JSON.stringify(form, null, 2);
  $("copy-status").textContent = "";
  $("tab-report").hidden = !report;
  const dictCount = report ? report.proposedDictionaries.length : 0;
  $("download-dicts").hidden = dictCount === 0;
  $("download-dicts").textContent = `Pobierz słowniki (${dictCount})`;
  if (report) renderReport(report);
  selectTab("preview");
  $("result-card").hidden = false;
  await preview.load(form, report);
  $("result-card").scrollIntoView({ behavior: "smooth", block: "start" });
}

function downloadJson(data, fileName) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = el("a", { href: url, download: fileName });
  document.body.append(link); link.click(); link.remove();
  URL.revokeObjectURL(url);
}

$("download").addEventListener("click", () => current && downloadJson(current.form, current.baseName + ".json"));
$("download-dicts").addEventListener("click", () => {
  if (current && current.report) downloadJson({ dictionaries: current.report.proposedDictionaries }, current.baseName + ".slowniki.json");
});
$("copy").addEventListener("click", async () => {
  if (!current) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(current.form, null, 2));
    $("copy-status").textContent = "Skopiowano.";
  } catch {
    $("copy-status").textContent = "Nie udało się skopiować — zaznacz tekst ręcznie.";
  }
});

/* ============================================================ walidatory pól */

const digits = (v) => String(v).replace(/[\s-]/g, "");
const weighted = (d, weights) => weights.reduce((sum, w, i) => sum + w * Number(d[i]), 0);
const VALIDATORS = {
  PESEL(v) {
    const d = digits(v);
    if (!/^\d{11}$/.test(d)) return "Numer PESEL ma 11 cyfr.";
    return (10 - (weighted(d, [1, 3, 7, 9, 1, 3, 7, 9, 1, 3]) % 10)) % 10 === Number(d[10]) ? null : "Nieprawidłowy numer PESEL.";
  },
  NIP(v) {
    const d = digits(v);
    if (!/^\d{10}$/.test(d)) return "NIP ma 10 cyfr.";
    const c = weighted(d, [6, 5, 7, 2, 3, 4, 5, 6, 7]) % 11;
    return c !== 10 && c === Number(d[9]) ? null : "Nieprawidłowy numer NIP.";
  },
  REGON(v) {
    const d = digits(v);
    if (/^\d{9}$/.test(d)) return (weighted(d, [8, 9, 2, 3, 4, 5, 6, 7]) % 11) % 10 === Number(d[8]) ? null : "Nieprawidłowy numer REGON.";
    if (/^\d{14}$/.test(d)) return (weighted(d, [2, 4, 8, 5, 0, 9, 7, 3, 6, 1, 2, 4, 8]) % 11) % 10 === Number(d[13]) ? null : "Nieprawidłowy numer REGON.";
    return "REGON ma 9 albo 14 cyfr.";
  },
  ZIP_CODE: (v) => (/^\d{2}-\d{3}$/.test(String(v).trim()) ? null : "Wpisz kod pocztowy w formacie 00-000."),
  EMAIL: (v) => (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim()) ? null : "Wpisz poprawny adres e-mail."),
  SERIAL_NUMBER_ID_CARD: (v) => (/^[A-Z]{3}\d{6}$/i.test(digits(v)) ? null : "Wpisz serię i numer dowodu, np. ABC123456."),
  ADE: (v) => (/^AE:PL-\d{5}-\d{5}-[A-Z]{5}-\d{2}$/i.test(String(v).trim()) ? null : "Wpisz adres do e-Doręczeń, np. AE:PL-12345-67890-ABCDE-12."),
};

/* ============================================================ podgląd eUsługi */

// Przykładowe wartości danych inicjalnych (w systemie docelowym pochodzą z rejestrów).
const SAMPLE_DATA = {
  name: "Jan", secondName: "Piotr", surname: "Kowalski", pesel: "44051401359", phoneNumber: "600 100 200",
  email: "jan.kowalski@example.pl", country: "Polska", voivodeship: "kujawsko-pomorskie", district: "Toruń",
  community: "Toruń", place: "Toruń", postCode: "87-100", street: "Polna", building: "1", apartment: "2",
  birthDate: "1944-05-14", citizenship: "polskie", sex: "mężczyzna", familyName: "Kowalski",
};
const COUNTRIES = ["Polska", "Niemcy", "Czechy", "Słowacja", "Ukraina", "Litwa", "Białoruś", "Rosja", "Łotwa", "Francja",
  "Wielka Brytania", "Irlandia", "Holandia", "Belgia", "Norwegia", "Szwecja", "Dania", "Włochy", "Hiszpania",
  "Austria", "Stany Zjednoczone", "Kanada", "Inny kraj"];
// W eksportach z systemu `validation` bywa także pustym obiektem ({}), nie tylko tablicą.
const rulesOf = (f) => (Array.isArray(f.validation) ? f.validation : []);
const INPUT_TYPES = new Set(["TEXT_FIELD", "TEXTAREA", "NUMBER", "DATEPICKER", "RADIO", "CHECKBOX", "SELECT", "FILE_UPLOADER", "CONSENT_SECTION"]);

// Opisy z konfiguracji to HTML — przepuszczamy tylko bezpieczne elementy, linki zamieniamy na tekst.
const SAFE_TAGS = new Set(["P", "UL", "OL", "LI", "STRONG", "B", "EM", "I", "BR"]);
function safeHtml(html) {
  const out = document.createDocumentFragment();
  if (!html) return out;
  const doc = new DOMParser().parseFromString(html, "text/html");
  const walk = (src, dst) => {
    for (const node of src.childNodes) {
      if (node.nodeType === Node.TEXT_NODE) dst.append(node.textContent);
      else if (node.nodeType === Node.ELEMENT_NODE) {
        if (SAFE_TAGS.has(node.tagName)) { const copy = document.createElement(node.tagName); walk(node, copy); dst.append(copy); }
        else if (!["SCRIPT", "STYLE", "IMG"].includes(node.tagName)) walk(node, dst);
      }
    }
  };
  walk(doc.body, out);
  return out;
}
const hasText = (html) => Boolean(html && new DOMParser().parseFromString(html, "text/html").body.textContent.trim());

const preview = {
  form: null, pages: [], page: 0, answers: new Map(), nodes: new Map(), fields: new Map(), compiled: new Map(),
  dictionaries: new Map(), visible: new Map(),

  async load(form, report) {
    this.form = structuredClone(form);
    this.pages = orderTabs(this.form);
    this.page = 0;
    this.answers = new Map();
    this.compiled = new Map();
    this.dictionaries = new Map((report ? report.proposedDictionaries : []).map((d) => [d.name, d.values]));
    this.fields = new Map();
    for (const tab of this.form.tabs) for (const q of tab.questions || []) {
      for (const c of q.field.repeatingSectionGrid || []) {
        this.fields.set(c.field.techName, c.field);
        const initial = initialAnswer(c.field);
        if (initial !== undefined) this.answers.set(c.field.techName, initial);
      }
    }
    await this.refreshVisibility();
    this.render();
  },

  // Widoczność według warunków `states` (JSONata) — liczona na kopii formularza z odpowiedziami w __userAnswer,
  // tak jak w systemie docelowym.
  async refreshVisibility() {
    for (const [tech, field] of this.fields) field.__userAnswer = this.answers.get(tech);
    const visible = new Map();
    const evaluate = async (field) => {
      const shows = (field.states || []).filter((s) => s.type === "SHOW" && s.query);
      for (const s of shows) {
        try {
          if (!this.compiled.has(s.query)) this.compiled.set(s.query, jsonata(s.query));
          if (!(await this.compiled.get(s.query).evaluate(this.form))) return false;
        } catch (err) {
          console.warn(`Nie udało się obliczyć warunku pola ${field.techName}:`, err.message);
        }
      }
      return true;
    };
    for (const tab of this.form.tabs) for (const q of tab.questions || []) {
      visible.set(q.field.id, await evaluate(q.field));
      for (const c of q.field.repeatingSectionGrid || []) visible.set(c.field.id, await evaluate(c.field));
    }
    this.visible = visible;
  },

  applyVisibility() {
    for (const [id, node] of this.nodes) node.hidden = this.visible.get(id) === false;
  },

  render() {
    const steps = $("steps");
    steps.replaceChildren(...this.pages.map((tab, i) => {
      const button = el("button", { type: "button", onclick: () => this.go(i) },
        el("span", { className: "num", textContent: String(i + 1) }), el("span", { textContent: tab.title || `Strona ${i + 1}` }));
      if (i === this.page) button.setAttribute("aria-current", "step");
      return el("li", {}, button);
    }));

    const tab = this.pages[this.page];
    const formNode = $("eform");
    this.nodes = new Map();
    const sections = [...(tab.questions || [])].sort((a, b) => (a.y - b.y) || (a.x - b.x)).map((q) => this.renderSection(q.field));
    formNode.replaceChildren(
      el("div", { className: "step-label", textContent: `Krok ${this.page + 1} z ${this.pages.length}${tab.type === "FINISH" ? " — strona końcowa" : ""}` }),
      el("div", { className: "progress" }, el("div", { style: `width:${((this.page + 1) / this.pages.length) * 100}%` })),
      el("h3", { textContent: tab.title || "" }),
      ...sections,
      el("div", { className: "nav" },
        el("button", { type: "button", className: "secondary", textContent: "Wstecz", disabled: this.page === 0, onclick: () => this.go(this.page - 1) }),
        this.page < this.pages.length - 1
          ? el("button", { type: "button", textContent: "Dalej", onclick: () => this.next() })
          : el("span", { className: "desc", textContent: "W systemie docelowym tu następuje podpis i wysłanie wniosku." })),
    );
    this.applyVisibility();
    $("show-tech").dispatchEvent(new Event("change"));
  },

  renderSection(section) {
    const children = [...(section.repeatingSectionGrid || [])].sort((a, b) => (a.y - b.y) || (a.x - b.x));
    const node = el("fieldset", { className: "section" },
      el("legend", {}, section.title || section.techName, techLabel(section.techName),
        section.type === "REPEATING_SECTION" ? el("span", { className: "badge", textContent: "sekcja powtarzalna" }) : null));
    if (hasText(section.description)) node.append(el("div", { className: "desc" }, safeHtml(section.description)));
    for (const c of children) node.append(this.renderField(c.field));
    this.nodes.set(section.id, node);
    return node;
  },

  renderField(f) {
    const id = "f-" + f.techName;
    const required = rulesOf(f).includes("REQUIRED");
    const value = this.answers.get(f.techName);
    const onChange = async (v) => { this.answers.set(f.techName, v); clearError(wrap); await this.refreshVisibility(); this.applyVisibility(); };
    const wrap = el("div", { className: "field" });
    wrap.dataset.tech = f.techName;
    this.nodes.set(f.id, wrap);

    if (f.type === "TEXT_BLOCK" || f.type === "INFO_SECTION") {
      wrap.className = "text-block";
      wrap.append(safeHtml(f.description), techLabel(f.techName));
      return wrap;
    }
    const labelText = f.title || (f.type === "CONSENT_SECTION" ? "Zgody i oświadczenia" : f.techName);
    // Pojedyncze pole → <label for>, grupa opcji/zgód → zwykły nagłówek (grupa ma własne etykiety opcji).
    const grouped = ["RADIO", "CHECKBOX", "CONSENT_SECTION"].includes(f.type);
    const label = el(grouped ? "span" : "label", { className: "label" }, labelText, required ? el("span", { className: "req", textContent: " *" }) : null,
      techLabel(f.techName),
      f.readOnly ? el("span", { className: "badge", textContent: f.defaultValueType === "EXTERNAL_SYSTEM" ? `z rejestru: ${f.defaultValue}` : "tylko do odczytu" }) : null,
      f.dictionaryName ? el("span", { className: "badge", textContent: `słownik: ${f.dictionaryName}` }) : null);
    wrap.append(label);
    if (hasText(f.description)) wrap.append(el("div", { className: "desc" }, safeHtml(f.description)));
    if (f.tooltipMessage) wrap.append(el("div", { className: "desc", textContent: f.tooltipMessage }));

    const options = optionsFor(f, this.dictionaries);
    let control;
    switch (f.type) {
      case "TEXTAREA":
        control = el("textarea", { id, value: value ?? "", readOnly: f.readOnly, onchange: (e) => onChange(e.target.value) });
        break;
      case "NUMBER": case "DATEPICKER": case "TEXT_FIELD": {
        const type = f.type === "NUMBER" ? "number" : f.type === "DATEPICKER" ? "date" : rulesOf(f).includes("EMAIL") ? "email" : "text";
        control = el("input", { id, type, value: value ?? "", readOnly: f.readOnly, onchange: (e) => onChange(e.target.value) });
        if (rulesOf(f).includes("ZIP_CODE")) control.placeholder = "__-___";
        break;
      }
      case "RADIO": case "CHECKBOX": {
        const multi = f.type === "CHECKBOX";
        control = el("div", { id, role: multi ? "group" : "radiogroup" });
        if (!options) { control.append(el("div", { className: "desc", textContent: dictHint(f) })); break; }
        for (const opt of options) {
          const input = el("input", { type: multi ? "checkbox" : "radio", name: id, value: opt, disabled: f.readOnly,
            checked: multi ? (value || []).includes(opt) : value === opt });
          input.addEventListener("change", () => {
            const chosen = [...control.querySelectorAll("input:checked")].map((i) => i.value);
            onChange(multi ? chosen : chosen[0]);
          });
          control.append(el("label", { className: "choice" }, input, el("span", { textContent: opt })));
        }
        break;
      }
      case "SELECT":
        if (!options) {
          control = el("input", { id, type: "text", value: value ?? "", placeholder: dictHint(f), onchange: (e) => onChange(e.target.value) });
        } else {
          control = el("select", { id, disabled: f.readOnly, onchange: (e) => onChange(e.target.value || undefined) },
            el("option", { value: "", textContent: "— wybierz —" }),
            ...options.map((o) => el("option", { value: o, textContent: o, selected: value === o })));
        }
        break;
      case "FILE_UPLOADER":
        control = el("input", { id, type: "file", onchange: (e) => onChange(e.target.files[0] ? e.target.files[0].name : undefined) });
        break;
      case "CONSENT_SECTION": {
        const consents = (f.consentSectionConfig && f.consentSectionConfig.consents) || [];
        control = el("div", { id, role: "group" });
        consents.forEach((c, i) => {
          const input = el("input", { type: "checkbox", checked: Boolean((value || [])[i]) });
          input.addEventListener("change", () => {
            const state = consents.map((_, j) => control.querySelectorAll("input")[j].checked);
            onChange(state);
          });
          control.append(el("label", { className: "choice" }, input,
            el("span", {}, safeHtml(c.description), c.required ? el("span", { className: "req", textContent: " *" }) : null)));
        });
        break;
      }
      default:
        control = el("div", { className: "desc", textContent: `Nieobsługiwany typ pola: ${f.type}` });
    }
    if (grouped) control.setAttribute("aria-label", labelText);
    else if (control.id) label.htmlFor = id;
    wrap.append(control, el("div", { className: "field-error", id: id + "-err", hidden: true }));
    return wrap;
  },

  // Walidacja tylko pól widocznych na bieżącej stronie (ukryte warunkami są pomijane, jak w eUsłudze).
  validatePage() {
    let firstInvalid = null;
    for (const q of this.pages[this.page].questions || []) {
      if (this.visible.get(q.field.id) === false) continue;
      for (const c of q.field.repeatingSectionGrid || []) {
        const f = c.field;
        if (!INPUT_TYPES.has(f.type) || this.visible.get(f.id) === false || f.readOnly) continue;
        const error = fieldError(f, this.answers.get(f.techName));
        const wrap = this.nodes.get(f.id);
        if (error) { setError(wrap, f, error); firstInvalid = firstInvalid || wrap; } else clearError(wrap);
      }
    }
    if (firstInvalid) { firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" }); (firstInvalid.querySelector("input,select,textarea") || firstInvalid).focus(); }
    return !firstInvalid;
  },

  next() { if (this.validatePage()) this.go(this.page + 1); },
  go(i) {
    if (i < 0 || i >= this.pages.length) return;
    this.page = i;
    this.render();
    $("eform").scrollIntoView({ behavior: "smooth", block: "start" });
  },
};

function orderTabs(form) {
  const tabs = form.tabs || [];
  const links = (form.flow && form.flow.links) || [];
  const byId = new Map(tabs.map((t) => [t.id, t]));
  const targets = new Set(links.map((l) => l.target));
  let currentTab = tabs.find((t) => !targets.has(t.id) && links.some((l) => l.source === t.id));
  const ordered = [];
  const seen = new Set();
  while (currentTab && !seen.has(currentTab.id)) {
    ordered.push(currentTab); seen.add(currentTab.id);
    const link = links.find((l) => l.source === currentTab.id);
    currentTab = link ? byId.get(link.target) : null;
  }
  return ordered.length === tabs.length ? ordered : tabs; // przepływ niepełny → kolejność z tablicy tabs
}

function initialAnswer(f) {
  const dv = f.defaultValue;
  if (dv === undefined || dv === null || dv === "") return undefined;
  if (f.defaultValueType === "EXTERNAL_SYSTEM") {
    const attr = String(dv).split(".").pop();
    return SAMPLE_DATA[attr] ?? `(${dv})`;
  }
  if (Array.isArray(dv)) return f.type === "CHECKBOX" ? dv : dv[0];
  return dv;
}

function optionsFor(f, proposed) {
  if ((f.options || []).length) return f.options.map((o) => o.name || o.id);
  const dict = f.dictionaryName;
  if (!dict) return null;
  if (dict === "Kraje") return COUNTRIES;
  if (proposed.has(dict)) return proposed.get(dict);
  return null;
}

function dictHint(f) {
  return /TERYT|Wojew|Powiat|Gmina|Miejscow/i.test(f.dictionaryName || "")
    ? "Słownik TERYT — w podglądzie pole tekstowe"
    : `Słownik „${f.dictionaryName}” — w podglądzie pole tekstowe`;
}

function fieldError(f, value) {
  const rules = rulesOf(f);
  const empty = value === undefined || value === null || value === "" || (Array.isArray(value) && value.length === 0);
  if (f.type === "CONSENT_SECTION") {
    const consents = (f.consentSectionConfig && f.consentSectionConfig.consents) || [];
    return consents.some((c, i) => c.required && !(value || [])[i]) ? "Zaznacz wymagane zgody." : null;
  }
  if (empty) return rules.includes("REQUIRED") ? "To pole jest wymagane." : null;
  for (const rule of rules) {
    const check = VALIDATORS[rule];
    const error = check && typeof value === "string" ? check(value) : null;
    if (error) return error;
  }
  return null;
}

function setError(wrap, f, message) {
  wrap.classList.add("invalid");
  const err = wrap.querySelector(".field-error");
  err.textContent = message; err.hidden = false;
  const control = wrap.querySelector("#f-" + CSS.escape(f.techName));
  if (control) { control.setAttribute("aria-invalid", "true"); control.setAttribute("aria-describedby", err.id); }
}

function clearError(wrap) {
  if (!wrap) return;
  wrap.classList.remove("invalid");
  const err = wrap.querySelector(".field-error");
  if (err) { err.hidden = true; err.textContent = ""; }
  for (const c of wrap.querySelectorAll("[aria-invalid]")) c.removeAttribute("aria-invalid");
}

function techLabel(name) {
  return el("span", { className: "tech", textContent: name, hidden: !$("show-tech").checked });
}
$("show-tech").addEventListener("change", (e) => {
  for (const t of document.querySelectorAll("#eform .tech")) t.hidden = !e.target.checked;
});

if (typeof jsonata !== "function") console.error("Biblioteka JSONata nie została wczytana — warunki widoczności nie będą liczone.");
init();
</script>
</body>
</html>
