# Uruchomienie: docker compose up --build   →   http://localhost
# Sekrety (JWT_SECRET, AUTH_PASSWORD, EDENAI_API_KEY) trzymaj w pliku .env (kopia .env.example).
# Ustawienia z sekcji `environment` mają pierwszeństwo przed .env — tu wygodnie zmienia się model.
services:
  formularze:
    build: ./backend/
    image: formularze-ai
    networks:
      form-net:
        ipv4_address: 172.19.0.10
    env_file: ./backend/.env
    environment:
      # --- Model językowy Eden AI (format: dostawca/model) --------------------------------------
      # Zmień wartość i uruchom ponownie: docker compose up -d
      # Przykładowe modele z katalogu Eden AI (https://app.edenai.run/models):
      #   mistral/mistral-large-4-0@eu      — domyślny: otwarte wagi, przetwarzanie w UE
      #   mistral/mistral-medium-3.5@eu     — szybszy, otwarte wagi, UE
      #   mistral/mistral-small-2603@eu     — najszybszy z rodziny Mistral, otwarte wagi, UE
      #   google/gemma-4-31b-it             — otwarte wagi (Google)
      LLM_MODEL: "mistral/mistral-large-4-0@eu"
      # Modele zapasowe, gdy główny zawiedzie (lista JSON; [] = bez zapasowych).
      LLM_FALLBACK_MODELS: '["mistral/mistral-medium-3.5@eu"]'
      # "false" = bez modelu: analiza regułowa (zero wywołań Eden AI — do testów bez zużycia tokenów).
      LLM_ENABLED: "true"
      # Limit czasu jednego wywołania (s) — duże formularze potrafią zająć modelowi kilka minut.
      AI_TIMEOUT_S: "300"
      # --- OCR skanów (JPG/PNG, PDF bez warstwy tekstowej) ---------------------------------------
      #   ocr/ocr/mistral | ocr/ocr/google | ocr/ocr/microsoft | ocr/ocr/amazon
      OCR_MODEL: "ocr/ocr/mistral"
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  
  frontend:
    build: ./web/
    image: frontend
    depends_on:
      - formularze
    networks:
      form-net:
        ipv4_address: 172.19.0.20
    ports:
      - "80:80"

  # Opcjonalny serwer MCP dla asystentów AI (ten sam obraz co backend, inna komenda startowa).
  # Analizę formularza wykonuje model asystenta (koszt po stronie użytkownika), generator buduje zgodny JSON.
  mcp:
    image: formularze-ai
    command: ["python", "-m", "app.mcp_server"]
    depends_on:
      - formularze
    networks:
      form-net:
        ipv4_address: 172.19.0.30
    env_file: ./backend/.env
    environment:
      # Adres rządowej aplikacji, do której MCP odsyła przy wykryciu danych osobowych.
      MCP_SAFE_APP_URL: "http://localhost"
    ports:
      - "8100:8100"
    healthcheck:  # obraz domyślnie sprawdza port 8000 (REST API) — MCP słucha na 8100
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8100), 3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  form-net:
    name: form-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24